<!doctype html>
<!-- source: https://ninesense.jp/contact/index.html -->
<html lang="ja"><head><meta charset="utf-8"><title>site-ninesense-jp</title></head><body>
<form action="#" method="post" id="contactbox" name="contactbox" onsubmit="var theURL='/contact222/'+document.contactbox.item.value+'.html';_gaq.push(['_trackPageview', theURL]);_gaq.push(['_trackPageview', '/contact/test.html']);_gaq.push(['_trackEvent', 'Contact', document.contactbox.item.value]);facebookConversionPixel(6022668327252,1.00);">
					<div class="linebox">
						<div class="innerbox clearfix">
							<dl>
								<dt>
									<label for="item">お問合せ項目<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<select name="item" id="item" class="validate[required]" title="お問合せ項目を選択してください" superselect="superselect-0" style="display:none">
										<option value="新規制作に関するお問い合わせ">新規制作に関するお問い合わせ</option>
										<option value="リニューアルに関するお問い合わせ">リニューアルに関するお問い合わせ</option>
										<option value="撮影に関するお問い合わせ">撮影に関するお問い合わせ</option>
										<option value="採用に関するお問い合わせ/お申込み">採用に関するお問い合わせ</option>
										<option value="イベント参加のお申込み">イベント参加のお申込み</option>
										<option value="プレス関係のお問い合わせ">プレス関係のお問い合わせ</option>
										<option value="その他">その他</option>
									</select><div id="superselect-0" style="display:inline-block" class="superselect-container"><div class="superselect-title" rel="新規制作に関するお問い合わせ">新規制作に関するお問い合わせ</div></div>
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="name">お名前<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<input type="text" name="name" id="name" class="textBoxStyle validate[required]" placeholder="例) 山田太郎" title="お名前(漢字)を入力してください" style="ime-mode:active;">
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="kana">フリガナ<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<input type="text" name="kana" id="kana" class="textBoxStyle validate[required]" placeholder="例) ヤマダタロウ" title="フリガナを入力してください" style="ime-mode:active;">
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="company">会社名 :</label>
								</dt>
								<dd>
									<input type="text" name="company" id="company" size="50" maxlength="128" class="textBoxStyle" placeholder="例) 株式会社ナインセンス" title="会社名を入力してください" style="ime-mode:active;">
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="address">住所 :</label>
								</dt>
								<dd>
									<input type="text" name="address" id="address" size="50" maxlength="128" class="textBoxStyle" placeholder="例) 東京都渋谷区神宮前9-99-9" title="住所を入力してください" style="ime-mode:active;">
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="phone">電話番号<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<input type="text" name="phone" id="phone" size="50" maxlength="128" class="textBoxStyle validate[required,custom[phone]]" placeholder="例) 03-3499-5620" title="電話番号を入力してください" style="ime-mode:inactive;">
								</dd>
							</dl>
							<dl>
								<dt>
									<label for="email">Email<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<input type="text" name="email" id="email" size="50" maxlength="128" class="textBoxStyle validate[required,custom[email]]" placeholder="例) info@ninesense.jp" title="Emailを入力してください" style="ime-mode:inactive;">
								</dd>
							</dl>
							<dl style="border-bottom:none">
								<dt>
									<label for="comments">内容<span class="musttxt">*</span> :</label>
								</dt>
								<dd>
									<textarea name="comments" id="comments" rows="12" cols="57" class="textAreaStyle validate[required]" placeholder="例) 新規ホームページ制作について..." title="お問合せ内容を入力してください" style="ime-mode:active;"></textarea>
								</dd>
							</dl>
						</div>
					</div>
					<div class="linebox">
						<div class="innerbox">
							<input type="submit" name="submit" class="button" id="submit" value="">
						</div>
					</div>
				</form>
</body></html>
