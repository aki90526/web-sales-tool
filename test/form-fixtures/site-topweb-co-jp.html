<!doctype html>

<form method="post" action="" enctype="multipart/form-data"><div class="stepbar">
	<dl>
		 <dt>01</dt>
		 <dd>項目の入力</dd>
	</dl>
	<dl>
		 <dt>02</dt>
		 <dd>入力内容の確認</dd>
	</dl>
	<dl>
		 <dt>03</dt>
		 <dd>完了</dd>
	</dl>
	</div>
	<div class="dl_wrap">
	<dl>
		 <dt>お問い合わせカテゴリ</dt>
		 <dd>	<span class="mwform-radio-field horizontal-item">
		<label for="category-1">
			<input type="radio" name="category" value="制作依頼・お見積り" id="category-1">
			<span class="mwform-radio-field-text">制作依頼・お見積り</span>
		</label>
	</span>
	<span class="mwform-radio-field horizontal-item">
		<label for="category-2">
			<input type="radio" name="category" value="採用へのご応募" id="category-2">
			<span class="mwform-radio-field-text">採用へのご応募</span>
		</label>
	</span>
	<span class="mwform-radio-field horizontal-item">
		<label for="category-3">
			<input type="radio" name="category" value="その他" id="category-3">
			<span class="mwform-radio-field-text">その他</span>
		</label>
	</span>

<input type="hidden" name="__children[category][]" value="{&quot;\u5236\u4f5c\u4f9d\u983c\u30fb\u304a\u898b\u7a4d\u308a&quot;:&quot;\u5236\u4f5c\u4f9d\u983c\u30fb\u304a\u898b\u7a4d\u308a&quot;,&quot;\u63a1\u7528\u3078\u306e\u3054\u5fdc\u52df&quot;:&quot;\u63a1\u7528\u3078\u306e\u3054\u5fdc\u52df&quot;,&quot;\u305d\u306e\u4ed6&quot;:&quot;\u305d\u306e\u4ed6&quot;}" style="display:none">
</dd>
	</dl>
	<dl>
		 <dt>お名前<span class="required">必須</span></dt>
		 <dd>
	<div class="form">
<input type="text" name="your_name" id="your_name" size="60" value="">
</div>
	<div class="ex">例）山田　太郎</div></dd>
	</dl>
	<dl>
		 <dt>貴社名</dt>
		 <dd>
	<div class="form">
<input type="text" name="your_company" id="your_company" size="60" value="">
</div>
	<div class="ex">例）株式会社トップ</div></dd>
	</dl>
	<dl>
		 <dt>ご住所</dt>
		 <dd>
	<div class="form">
<input type="text" name="your_address" id="your_address" size="60" value="">
</div>
	<div class="ex">例）東京都江東区有明３丁目７番１１号有明パークビル２０Ｆ</div></dd>
	</dl>
	<dl>
		 <dt>電話番号<span class="required">必須</span></dt>
		 <dd>
	<div class="form">
<input type="text" name="telnum" id="telnum" size="60" value="">
</div>
	<div class="ex">例）03-1234-5678</div></dd>
	</dl>
	<dl>
		 <dt>メールアドレス<span class="required">必須</span></dt>
		 <dd>
	<div class="form">
<input type="email" name="your_mail" id="your_mail" size="60" value="" data-conv-half-alphanumeric="true">
</div>
	<div class="ex">例）sample@topweb.co.jp</div></dd>
	</dl>
	<dl>
		 <dt>お問い合わせ内容<span class="required">必須</span></dt>
		 <dd>
	<div class="form">
<textarea name="textarea" id="textarea" cols="50" rows="5"></textarea>
</div>
	<div class="ex">例）WEB解析サービス付きで、ホームページ制作をお願いしたい　等</div></dd>
	</dl>
	</div>
	<div class="coution" style="text-align: center">当社の<a href="/privacy/" target="_blank" rel="noopener">プライバシーポリシー</a>を確認、同意したうえで送信してください。</div>
	<div class="consent">
	<span class="mwform-checkbox-field horizontal-item">
		<label for="consent-1">
			<input type="checkbox" name="consent[data][]" value="上記プライバシーポリシーに同意する" id="consent-1">
			<span class="mwform-checkbox-field-text">上記プライバシーポリシーに同意する</span>
		</label>
	</span>

<input type="hidden" name="consent[separator]" value="," style="display:none">

<input type="hidden" name="__children[consent][]" value="{&quot;\u4e0a\u8a18\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u540c\u610f\u3059\u308b&quot;:&quot;\u4e0a\u8a18\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u540c\u610f\u3059\u308b&quot;}" style="display:none">
</div>

			<div class="confirm_btn"></div>
		</li>
		<li class="contact_btnItem">
			<div class="confirm_btn">
<input type="submit" name="submitConfirm" value="確認画面へ">
</div>
		</li>
	</ul><input type="hidden" name="mw-wp-form-form-id" value="173" style="display:none"><input type="hidden" name="mw_wp_form_token" value="ce47588809c652ee4d64c77fab442964ffff77e4bf6f65955142368dd4686684" style="display:none"></form>
