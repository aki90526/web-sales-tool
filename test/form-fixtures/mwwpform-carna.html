<!doctype html>
<!-- source: https://carna.style/ -->
<html lang="ja"><head><meta charset="utf-8"><title>mwwpform-carna</title></head><body>
<form method="post" action="" enctype="multipart/form-data"><table class="table mb-5">
<tbody>
<tr>
<th>お名前<span class="check">（必須）</span></th>
<td>
<input type="text" name="お名前" size="60" value="">
</td>
</tr>
<tr>
<th>フリガナ</th>
<td>
<input type="text" name="フリガナ" size="60" value="">
</td>
</tr>
<tr>
<th>メールアドレス<span class="check">（必須）</span></th>
<td>
<input type="email" name="メールアドレス" size="60" value="" data-conv-half-alphanumeric="true">
</td>
</tr>
<tr>
<th>メールアドレス（確認）<span class="check">（必須）</span></th>
<td>
<input type="email" name="メールアドレス（確認）" size="60" value="" data-conv-half-alphanumeric="true">
</td>
</tr>
<tr>
<th>電話番号</th>
<td>
<span class="mwform-tel-field">
<input type="text" name="電話番号[data][0]" size="6" maxlength="5" value="" data-conv-half-alphanumeric="true">
-	<input type="text" name="電話番号[data][1]" size="5" maxlength="4" value="" data-conv-half-alphanumeric="true">
-	<input type="text" name="電話番号[data][2]" size="5" maxlength="4" value="" data-conv-half-alphanumeric="true">
</span>
<input type="hidden" name="電話番号[separator]" value="-" style="display:none">
</td>
</tr>
<tr>
<th>お問い合わせ内容<span class="check">（必須）</span></th>
<td>
<textarea name="お問い合わせ内容" cols="50" rows="10"></textarea>
</td>
</tr>
<tr>
<th>送信確認<span class="check">（必須）</span></th>
<td>
<span class="mwform-checkbox-field horizontal-item">
<label>
<input type="checkbox" name="送信確認[data][]" value="上記内容で送信する">
<span class="mwform-checkbox-field-text">上記内容で送信する</span>
</label>
</span>
<input type="hidden" name="送信確認[separator]" value="," style="display:none">
<input type="hidden" name="__children[送信確認][]" value="{&quot;\u4e0a\u8a18\u5185\u5bb9\u3067\u9001\u4fe1\u3059\u308b&quot;:&quot;\u4e0a\u8a18\u5185\u5bb9\u3067\u9001\u4fe1\u3059\u308b&quot;}" style="display:none">
</td>
</tr>
</tbody>
</table>
<div class="text-center">
<input type="submit" name="submitConfirm" value="確認する" class="btn btn-dark btn-lg btn-block col-md-4 mx-auto">
</div>
<input type="hidden" name="mw-wp-form-form-id" value="8" style="display:none"><input type="hidden" name="mw_wp_form_token" value="18cd63cfb86d347d328c48e74030ee8a5259cb19682af216102dd595212feb93" style="display:none"></form>
</body></html>
