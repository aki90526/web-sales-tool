<!doctype html>
<!-- source: https://kurum.jp/contact/ -->
<html lang="ja"><head><meta charset="utf-8"><title>site-kurum-jp</title></head><body>
<form method="post" action="" enctype="multipart/form-data"><p><!--contactForm--></p>
<section id="contactForm">
<p class="formNote confirm-hidden">以下のフォームに必要事項をご記入の上、確認ボタンをクリックして下さい。<br>
内容を確認した後、担当者よりお返事いたします。<br>
<span class="text-line">*</span>が付いている項目は必須項目になります。</p>
<p class="formNote input-hidden" style="display:none">入力内容を確認し送信してください。</p>
<dl>
<dt>所属・会社名<span class="required">*</span></dt>
<dd>
<div class="inputBox">
<input type="text" name="company" size="60" value="" placeholder="所属・会社名を入力してください">
</div>
</dd>
</dl>
<dl>
<dt>お名前<span class="required">*</span></dt>
<dd>
<div class="inputBox">
<input type="text" name="name" size="60" value="" placeholder="お名前を入力してください">
</div>
</dd>
</dl>
<dl>
<dt>メールアドレス<span class="required">*</span></dt>
<dd>
<div class="inputBox">
<input type="email" name="mail" size="60" value="" placeholder="メールアドレスを入力してください" data-conv-half-alphanumeric="true">
</div>
</dd>
</dl>
<dl>
<dt>お問い合わせ種別<span class="required">*</span></dt>
<dd>
<div class="inputBox">
<div class="selectBox">
<select name="category">
			<option value="" selected="selected">
			選択してください		</option>
			<option value="ホームページ制作に関するご相談">
			ホームページ制作に関するご相談		</option>
			<option value="Googleビジネスプロフィールに関するご相談">
			Googleビジネスプロフィールに関するご相談		</option>
			<option value="動画制作に関するご相談">
			動画制作に関するご相談		</option>
			<option value="ラジオCM広告代理店に関するご相談">
			ラジオCM広告代理店に関するご相談		</option>
			<option value="その他のご相談">
			その他のご相談		</option>
	</select>
</div>
<p>
</p></div>
</dd>
</dl>
<dl>
<dt>お問い合わせ内容<span class="required">*</span></dt>
<dd>
<div class="inputBox">
<textarea name="contents" cols="50" rows="5" placeholder="お困りのことやご相談内容を入力してください"></textarea>
</div>
</dd>
</dl>
<div class="privacyBox confirm-hidden">
<p class="ttl confirm-hidden">個人情報の取り扱いについて</p>
<p class="txt confirm-hidden">ご入力いただきました個人情報は、「<a href="../policy/" target="_blank" rel="noopener">プライバシーポリシー</a>」に記載の範囲で利用いたします。<br>
個人情報の取り扱いについては、「<a href="../policy/" target="_blank" rel="noopener">プライバシーポリシー</a>」をご参照ください。</p>
<div class="checkboxWrap">

	<span class="mwform-checkbox-field horizontal-item">
		<label>
			<input type="checkbox" name="privacy[data][]" value="プライバシーポリシーに同意します" style="display:none">
			<span class="mwform-checkbox-field-text">プライバシーポリシーに同意します</span>
		</label>
	</span>

<input type="hidden" name="privacy[separator]" value="," style="display:none">

<input type="hidden" name="__children[privacy][]" value="{&quot;\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u540c\u610f\u3057\u307e\u3059&quot;:&quot;\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u540c\u610f\u3057\u307e\u3059&quot;}" style="display:none">

</div>
</div>
<div class="submitBox">
<br>

<input type="submit" name="submitConfirm" value="確認画面へ">

</div>
</section>
<input type="hidden" name="mw-wp-form-form-id" value="526" style="display:none"><input type="hidden" name="mw_wp_form_token" value="7ff11e7e7d15defcd74b7a587d1af6d7b1e24aba808fe261a3a094d42f278829" style="display:none"></form>
</body></html>
