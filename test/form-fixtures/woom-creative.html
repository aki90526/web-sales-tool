<form method="post" action="" enctype="multipart/form-data"><dl class="dl-table">
<dt>職種<span class="require">※必須</span>

	<span class="mwform-checkbox-field vertical-item">

		</label>
	</span>
	<span class="mwform-checkbox-field vertical-item">
		<label>
			<input type="checkbox" name="職種[data][]" value="WEB以外のデザイン">
			<span class="mwform-checkbox-field-text">WEB以外のデザイン</span>
		</label>
	</span>
	<span class="mwform-checkbox-field vertical-item">
		<label>
			<input type="checkbox" name="職種[data][]" value="ライティング">

		</label>
	</span>
	<span class="mwform-checkbox-field vertical-item">
		<label>
			<input type="checkbox" name="職種[data][]" value="写真撮影">

	</span>
	<span class="mwform-checkbox-field vertical-item">
		<label>
			<input type="checkbox" name="職種[data][]" value="動画撮影・編集">
			<span class="mwform-checkbox-field-text">動画撮影・編集</span>
		</label>
	</span>
	<span class="mwform-checkbox-field vertical-item">
		<label>
			<input type="checkbox" name="職種[data][]" value="スマホアプリ開発">
			<span class="mwform-checkbox-field-text">スマホアプリ開発</span>
		</label>
	</span>

</dd><dt>法人名・屋号<span class="require">※必須</span>
</dt><dd>
<input type="text" name="法人名" size="60" value="">

</dd><dt>部署名等
</dt><dd>
<input type="text" name="部署" size="60" value="">

</dd><dt>担当者名<span class="require">※必須</span>
</dt><dd>
<input type="text" name="名前" size="60" value="">

</dd><dt>メールアドレス<span class="require">※必須</span>
</dt><dd>
<input type="email" name="メール" size="60" value="" placeholder="例） sample@woom.jp" data-conv-half-alphanumeric="true">

</dd><dt>住所<span class="require">※必須</span>
</dt><dd>〒 
<input type="tel" name="郵便番号" id="zip" size="3" maxlength="3" value="" placeholder="住所自動入力">
 - 
<input type="tel" name="zip" id="zip1" size="4" maxlength="4" value="">
<br>
<input type="text" name="pref" id="pref" size="6" value="" placeholder="都道府県">
&nbsp;
<input type="text" name="addr" id="addr" size="30" value="">

</dd><dt>電話番号<span class="require">※必須</span>
</dt><dd>
<input type="text" name="電話番号" size="60" value="" data-conv-half-alphanumeric="true">

</dd><dt>インボイス対応<span class="require">※必須</span>
</dt><dd>	<span class="mwform-radio-field horizontal-item">

			<span class="mwform-radio-field-text">対応している</span>
		</label>
	</span>
	<span class="mwform-radio-field horizontal-item">
		<label>
			<input type="radio" name="インボイス" value="対応していない">
			<span class="mwform-radio-field-text">対応していない</span>
		</label>
	</span>

<input type="hidden" name="__children[インボイス][]" value="{&quot;\u5bfe\u5fdc\u3057\u3066\u3044\u308b&quot;:&quot;\u5bfe\u5fdc\u3057\u3066\u3044\u308b&quot;,&quot;\u5bfe\u5fdc\u3057\u3066\u3044\u306a\u3044&quot;:&quot;\u5bfe\u5fdc\u3057\u3066\u3044\u306a\u3044&quot;}" style="display:none">

</dd><dt>制作実績URL
</dt><dd>
<input type="text" name="実績" size="60" value="">

</dd><dt>ご提案内容<span class="require">※必須</span>
</dt><dd>
<textarea name="問い合わせ内容" cols="50" rows="5"></textarea>

</dd><dt>価格の目安<span class="require">※必須</span>
</dt><dd>
<textarea name="価格" cols="50" rows="5"></textarea>

</dd></dl>
