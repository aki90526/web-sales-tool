<!doctype html>

<form action="./" method="post" id="form1">

<div class="FormBox">

	<tbody><tr data-name="category_id">

</tr>

</tr>

<tr>
	<th colspan="2" class="submit">
		<label><input type="submit" name="Submit" class="contact_btn" value="確　認"></label>
	</th>
</tr>
</tbody></table>
</div>
