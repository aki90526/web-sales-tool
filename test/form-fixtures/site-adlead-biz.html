<!doctype html>
<!-- source: https://www.adlead.biz/contact/ -->
<html lang="ja"><head><meta charset="utf-8"><title>site-adlead-biz</title></head><body>
<form method="post" action="conf.cgi">
  <table summary="会社概要" id="contact-form">
  <tbody><tr>
    <th>お名前<span class="req">*</span></th>
    <td><input type="text" name="お名前"></td>
  </tr>
  <tr>
    <th>メールアドレス<span class="req">*</span></th>
    <td><input type="text" name="メールアドレス"></td>
  </tr>
  <tr>
    <th>貴社名</th>
    <td><input type="text" name="貴社名"></td>
  </tr>
  <tr>
    <th>お問い合わせ内容<span class="req">*</span></th>
    <td><textarea cols="50" rows="10" name="お問い合わせ内容"></textarea></td>
  </tr>
  </tbody></table>
  <div>
    <input type="reset" value="リセット">
    <input type="submit" value="送信">
  </div>
</form>
</body></html>
