<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>pilot 動的: 添付ファイル必須（管理下・架空）</title></head>
<body>
<h1>お問い合わせ（添付必須。テスト用）</h1>
<form method="post" action="/receive" enctype="multipart/form-data">
  <p><label>お名前（必須） <input type="text" name="name" required></label></p>
  <p><label>メールアドレス（必須） <input type="email" name="email" required></label></p>
  <p><label>お問い合わせ内容（必須） <textarea name="message" required></textarea></label></p>
  <p><label>資料の添付（必須） <input type="file" name="attachment" required></label></p>
  <p><button type="submit" id="submit">送信</button></p>
</form>
</body></html>
