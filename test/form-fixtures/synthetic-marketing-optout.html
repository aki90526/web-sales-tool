<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>メルマガ等の受信希望の欄（合成フィクスチャ）</title></head>
<body>
<!-- 実サイトではなく、受信希望の欄の扱いを確認するための合成フォーム。送信先は存在しない -->
<form action="/synthetic-no-send" method="post" id="contact">
  <p><label>会社名 <input type="text" name="company"></label></p>
  <p><label>お名前 <input type="text" name="your-name"></label></p>
  <p><label>メールアドレス <input type="email" name="your-email"></label></p>
  <p><label>お問い合わせ内容 <textarea name="your-message"></textarea></label></p>

  <fieldset>
    <legend>今後の当社からのメール配信</legend>
    <label><input type="radio" name="news_a" value="1" checked> 希望する</label>
    <label><input type="radio" name="news_a" value="0"> 希望しない</label>
  </fieldset>

  <p><label><input type="checkbox" name="news_b" value="yes" checked> メールマガジンを受け取る</label></p>

  <fieldset>
    <legend>最新情報のご案内</legend>
    <label><input type="checkbox" name="news_c[]" value="want"> 希望する</label>
    <label><input type="checkbox" name="news_c[]" value="notwant"> 希望しない</label>
  </fieldset>

  <p>セミナーのご案内メール
    <select name="news_d">
      <option value="">選択してください</option>
      <option value="yes">配信を希望する</option>
      <option value="no">配信を希望しない</option>
    </select>
  </p>

  <fieldset>
    <legend>メルマガの配信について</legend>
    <label><input type="radio" name="news_e" value="y"> はい</label>
    <label><input type="radio" name="news_e" value="n"> いいえ</label>
  </fieldset>

  <p><label><input type="checkbox" name="agree_bundle" value="on"> 個人情報の取り扱いおよび今後のご案内メールの配信に同意します</label></p>

  <fieldset>
    <legend>今後のメール配信（必須）</legend>
    <label><input type="radio" name="news_f" value="yes" required checked> 受信する</label>
    <label><input type="radio" name="news_f" value="no" required> 受信しない</label>
  </fieldset>

  <p><label><input type="checkbox" name="news_g" value="yes" required checked> メールマガジンの配信を受け取る（必須）</label></p>

  <p>セミナーのご案内メール（はい／いいえ）
    <select name="news_i">
      <option value="">選択してください</option>
      <option value="yes">はい</option>
      <option value="no">いいえ</option>
    </select>
  </p>

  <fieldset>
    <legend>個人情報の取り扱いと今後のご案内メールの配信について</legend>
    <label><input type="radio" name="agree_radio" value="agree"> 同意する</label>
    <label><input type="radio" name="agree_radio" value="disagree"> 同意しない</label>
  </fieldset>

  <fieldset>
    <legend>お問い合わせ項目</legend>
    <label><input type="checkbox" name="topic[]" value="a"> 販促物・会社案内の制作</label>
    <label><input type="checkbox" name="topic[]" value="b"> Webサイトの制作</label>
  </fieldset>

  <p><button type="submit">送信</button></p>
</form>
</body>
</html>
