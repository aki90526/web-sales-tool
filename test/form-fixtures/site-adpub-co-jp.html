<!doctype html>
<!-- source: https://www.adpub.co.jp/contact/ -->
<html lang="ja"><head><meta charset="utf-8"><title>site-adpub-co-jp</title></head><body>
<form method="post" action="" enctype="multipart/form-data"><p style="color:red;font-size:15px;text-align:center">
<a href="/contact-biz">協業・営業・採用のお問い合せはこちらから ＞</a></p>

<div id="contactpage">
<h3 class="contact-p" style="font-size:24px;text-align:center;margin:40px auto 0;background-color:#ececec">業務のご依頼・ご相談 専用フォーム</h3>


<p style="font-size:12px;text-align:center">※マークは入力必須です<br>　</p>
<dl>
<dt>法人名 ※</dt>
<dd>
<div style="margin-bottom: 16px">

<input type="text" name="your-company" class="textbox" size="60" value="" placeholder="法人名">

</div>
</dd>
<dt>お名前 ※</dt>
<dd class="clearfix">
<div class="sei">

<label for="" class="updnWatermark" style="display:none">姓</label><input type="text" name="f-name" class="fname" size="25" value="" placeholder="姓" title="姓">

</div>
<div class="mei">

<label for="" class="updnWatermark" style="display:none">名</label><input type="text" name="l-name" class="lname" size="25" value="" placeholder="名" title="名">

</div>
</dd>
<dt>拠点・所在地 ※</dt>
<dd>
<div style="margin-bottom: 16px">

<label for="" class="updnWatermark" style="display:none">ご住所</label><input type="text" name="your-address" class="textbox" size="60" value="" placeholder="拠点・所在地" title="ご住所">

</div>
</dd>
<dt>お電話番号 ※</dt>
<dd>
<div style="margin-bottom: 16px">

<label for="" class="updnWatermark" style="display:none">お電話番号</label><input type="text" name="your-tel" class="textbox" size="60" value="" placeholder="お電話番号" title="お電話番号">

</div>
</dd>
<dt>メールアドレス ※</dt>
<dd>
<div style="margin-bottom: 16px">

<label for="" class="updnWatermark" style="display:none">メールアドレス</label><input type="email" name="your-email" class="textbox" size="60" value="" placeholder="メールアドレス" data-conv-half-alphanumeric="true" title="メールアドレス">

</div>
</dd>
<dt>お問い合せ項目 ※</dt>
<dd>

<select name="your-subject" class="textbox">
			<option value="" selected="selected">
			---お選び下さい---		</option>
			<option value="マーケティング">
			マーケティング		</option>
			<option value="ブランディング">
			ブランディング		</option>
			<option value="WEB制作・WEB広告">
			WEB制作・WEB広告		</option>
			<option value="動画制作">
			動画制作		</option>
			<option value="カタログ・パンフレット">
			カタログ・パンフレット		</option>
			<option value="印刷物">
			印刷物		</option>
			<option value="展示会ブース">
			展示会ブース		</option>
			<option value="お見積のご依頼">
			お見積のご依頼		</option>
			<option value="その他制作物のご依頼">
			その他制作物のご依頼		</option>
	</select>

</dd>
<dt>お問い合せ内容 ※</dt>
<dd>

<label for="" class="updnWatermark" style="display:none">お問い合わせ内容</label><textarea name="your-message" class="textbox" cols="60" rows="5" placeholder="お問い合わせ内容" title="お問い合わせ内容"></textarea>

</dd>
</dl>
<div class="contactBtn">
　

<input type="submit" name="submitConfirm" value="確認画面へ ＞" class="contactBT">

</div><input type="hidden" name="mw-wp-form-form-id" value="1515" style="display:none"><input type="hidden" name="mw_wp_form_token" value="053479b03382e9e71bf895c744dfe31c7230e508ebdee089280a06d2449b89a6" style="display:none">
				<!-- end .mw_wp_form --></div></form>
</body></html>
