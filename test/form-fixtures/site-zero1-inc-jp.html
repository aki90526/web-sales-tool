<!doctype html>
<!-- source: https://www.zero1-inc.jp/company -->
<html lang="ja"><head><meta charset="utf-8"><title>site-zero1-inc-jp</title></head><body>
<form id="contact-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfZSHLXNAFlfsLWyOQnZ3PJ73dWf6Yn9PJk5zFHYIaUKTvCIw/formResponse" method="POST">

        <div class="field">
          <label for="company">会社名<span class="req">必須</span></label>
          <input type="text" id="company" name="entry.17910172" placeholder="株式会社◯◯">
          <div class="error" style="display:none">会社名をご入力ください。</div>
        </div>

        <div class="field">
          <label for="ceo">会社代表者名<span class="req">必須</span></label>
          <input type="text" id="ceo" name="entry.1180541822" placeholder="山田 一郎">
          <div class="error" style="display:none">会社代表者名をご入力ください。</div>
        </div>

        <div class="field">
          <label for="department">担当部署名<span class="req">必須</span></label>
          <input type="text" id="department" name="entry.1518969869" placeholder="営業部">
          <div class="error" style="display:none">担当部署名をご入力ください。</div>
        </div>

        <div class="field">
          <label for="name">担当者名<span class="req">必須</span></label>
          <input type="text" id="name" name="entry.1078960731" placeholder="山田 太郎">
          <div class="error" style="display:none">担当者名をご入力ください。</div>
        </div>

        <div class="field">
          <label for="phone">担当者電話番号<span class="req">必須</span></label>
          <input type="tel" id="phone" name="entry.1458513274" placeholder="03-0000-0000">
          <div class="error" style="display:none">担当者電話番号をご入力ください。</div>
        </div>

        <div class="field">
          <label for="email">担当者メールアドレス<span class="req">必須</span></label>
          <input type="email" id="email" name="entry.1736840145" placeholder="name@example.com">
          <div class="error" style="display:none">正しいメールアドレスをご入力ください。</div>
        </div>

        <div class="field">
          <label for="contact-method">希望連絡方法<span class="req">必須</span></label>
          <select id="contact-method" name="entry.1299536522">
            <option value="">選択してください</option>
            <option value="メール">メール</option>
            <option value="電話">電話</option>
            <option value="どちらでも可">どちらでも可</option>
          </select>
          <div class="error" style="display:none">希望連絡方法をお選びください。</div>
        </div>

        <div class="field">
          <label for="subject">お問い合わせ件名<span class="req">必須</span></label>
          <input type="text" id="subject" name="entry.1180139747" placeholder="お問い合わせの件名をご記入ください">
          <div class="error" style="display:none">お問い合わせ件名をご入力ください。</div>
        </div>

        <div class="field">
          <label for="message">お問い合わせ本文<span class="req">必須</span></label>
          <textarea id="message" name="entry.541760577" placeholder="お問い合わせ内容をご記入ください　※本文内に営業のお問い合わせはお断りしております"></textarea>
          <div class="error" style="display:none">お問い合わせ本文をご入力ください。</div>
        </div>

        <div class="submit-row">
          <button type="submit" class="btn-submit">送信する</button>
        </div>
      </form>
</body></html>
