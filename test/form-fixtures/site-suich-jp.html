<!doctype html>
<!-- source: https://suich.jp/contact/other/ -->
<html lang="ja"><head><meta charset="utf-8"><title>site-suich-jp</title></head><body>
<form method="post" id="mail_form" action="https://suich.jp/wp/wp-content/themes/suich_tp/file/mailforms/php/other_mailform.php">
<dl class="fadein anime required show"><dt><i><span class="required">必須</span></i>メールアドレス</dt><dd class="required"><input type="email" name="mail_address" id="mail_address" placeholder="contact@suich.jp" value=""><span class="error_blank"></span><span class="error_format"></span></dd></dl>
<dl class="fadein anime show"><dt><i><span class="required">必須</span></i>ご担当者名</dt>
<dd class="required fadein anime show"><input type="text" name="c_name" id="c_name" placeholder="鈴木一郎"><span class="error_blank"></span></dd></dl>
<dl class="fadein anime required show"><dt><i><span class="required">必須</span></i>お電話番号</dt><dd class="required"><input type="tel" name="phone" id="phone" placeholder="電話番号を入力してください。" value=""><span class="error_blank"></span></dd></dl>
<dl class="fadein anime"><dt><i><span class="required">必須</span></i>会社・組織名</dt>
<dd class="required fadein anime"><input type="text" name="c_company" id="c_company" placeholder="株式会社suich"><span class="error_blank"></span></dd></dl>
<dl class="fadein anime"><dt><i><span class="required">必須</span></i>部署名</dt>
<dd class="required fadein anime"><input type="text" name="c_busho" id="c_busho" placeholder="回答を入力"><span class="error_blank"></span></dd></dl>
<dl class="fadein anime"><dt><i><span class="required">必須</span></i>ウェブサイト</dt>
<dd class="required fadein anime"><input type="text" name="c_url" id="c_url" placeholder="お持ちでない場合「なし」とご入力下さい"><span class="error_blank"></span></dd></dl>
<dl class="fadein anime required"><dt><i><span class="required">必須</span></i>郵便番号</dt><dd class="required"><input type="text" name="num_address" id="num_address" placeholder="343-0813" value=""><span class="error_blank"></span></dd></dl>
<dl class="fadein anime required"><dt><i><span class="required">必須</span></i>ご住所</dt><dd class="required"><input type="text" name="address" id="address" placeholder="埼玉県越谷市越ヶ谷2-8-9KSベース205" value=""><span class="error_blank"></span></dd></dl>
<dl class="fadein anime required"><dt><i><span class="required">必須</span></i>お問い合わせ内容詳細</dt><dd class="required"><textarea name="c_txt" id="c_txt" rows="10" placeholder="ご依頼内容の詳細についてお聞かせください"></textarea><span class="error_blank"></span></dd></dl>
<dl class="fadein anime required"><dt><i><span class="required">必須</span></i>弊社HPの印象</dt><dd class="required"><textarea name="c_webinsho" id="c_webinsho" rows="5" placeholder="弊社HPを見ての印象を教えてください"></textarea>
<span class="error_blank"></span></dd></dl>
<p class="pp_tbox">当社の<a href="/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>について<br class="sp" style="display:none">同意される⽅のみ送信できます。</p>
<div class="checkboxs fadein anime"><label><input id="checkBtn" type="checkbox"><span>上記プライバシーポリシーに同意する</span></label></div>
<p id="form_submit" class="fadein anime"><input id="form_submit_button" type="button" value="送信する" disabled=""></p>
</form>
</body></html>
