<div class="dc_data_list contact_table recruit_table">
<dl class="clearfix">
<dt>応募職種</dt>
<dd><select name="応募職種" class=" mfp_element_select-one mfp_element_all" id="mfp_element_0"><option value="WEBデザイナー">WEBデザイナー</option><option value="WEBプログラマー">WEBプログラマー</option><option value="WEBディレクター">WEBディレクター</option><option value="制作パートナー（外注）">制作パートナー（外注）</option></select><div class="mfp_err" id="errormsg_応募職種" style="display:none"></div></dd>

<dt>メールアドレス</dt>
<dd class="mail"><input name="email" type="email" placeholder="半角英数字" data-type="email" class=" mfp_element_email mfp_element_all" id="mfp_element_2"><div class="mfp_err" id="errormsg_email" style="display:none"></div></dd>
<dt>電話番号</dt>
<dd class="tel"><input name="電話番号" type="text" placeholder="半角英数字" class=" mfp_element_text mfp_element_all mfp_defaultValue" id="mfp_element_3"><div class="mfp_err" id="errormsg_電話番号" style="display:none"></div></dd>

<dt>直近の職歴/学歴</dt>
<dd class="shokureki"><input name="直近の職歴/学歴（1）" type="hidden" value="" data-join="直近の職歴/学歴（1）:歴+ ( +直近の職歴/学歴（1）:期間（start）+ ～ +直近の職歴/学歴（1）:期間（end）+ ）" class=" mfp_element_hidden mfp_element_all" id="mfp_element_9" style="display:none"><input name="直近の職歴/学歴（2）" type="hidden" value="" data-join="直近の職歴/学歴（2）:歴+ ( +直近の職歴/学歴（2）:期間（start）+ ～ +直近の職歴/学歴（2）:期間（end）+ ）" class=" mfp_element_hidden mfp_element_all" id="mfp_element_10" style="display:none">（1）<input class="text mfp_element_text mfp_element_all mfp_defaultValue" name="直近の職歴/学歴（1）:歴" type="text" id="mfp_element_11"><br>
（期間：<input class="calendar mfp_element_date mfp_element_all" name="直近の職歴/学歴（1）:期間（start）" type="date" id="mfp_element_12" style="text-align: center;">～<input class="calendar mfp_element_date mfp_element_all" name="直近の職歴/学歴（1）:期間（end）" type="date" id="mfp_element_13" style="text-align: center;">）<br>
（2）<input class="text mfp_element_text mfp_element_all mfp_defaultValue" name="直近の職歴/学歴（2）:歴" type="text" id="mfp_element_14"><br>
（期間：<input class="calendar mfp_element_date mfp_element_all" name="直近の職歴/学歴（2）:期間（start）" type="date" id="mfp_element_15" style="text-align: center;">～<input class="calendar mfp_element_date mfp_element_all" name="直近の職歴/学歴（2）:期間（end）" type="date" id="mfp_element_16" style="text-align: center;">）<div class="mfp_err" id="errormsg_直近の職歴/学歴（1）:歴" style="display:none"></div><div class="mfp_err" id="errormsg_直近の職歴/学歴（1）:期間（start）" style="display:none"></div><div class="mfp_err" id="errormsg_直近の職歴/学歴（1）:期間（end）" style="display:none"></div><div class="mfp_err" id="errormsg_直近の職歴/学歴（2）:歴" style="display:none"></div><div class="mfp_err" id="errormsg_直近の職歴/学歴（2）:期間（start）" style="display:none"></div><div class="mfp_err" id="errormsg_直近の職歴/学歴（2）:期間（end）" style="display:none"></div></dd>
<dt>自己PR URL</dt>
<dd class="port">（1）<input class="text mfp_element_text mfp_element_all mfp_defaultValue" name="自己PR URL（1）" type="text" placeholder="URLを入力" id="mfp_element_17"><br>
（2）<input class="text mfp_element_text mfp_element_all mfp_defaultValue" name="自己PR URL（2）" type="text" placeholder="URLを入力" id="mfp_element_18"><br>
（3）<input class="text mfp_element_text mfp_element_all mfp_defaultValue" name="自己PR URL（3）" type="text" placeholder="URLを入力" id="mfp_element_19"><br>
ポートフォリオ、プロフィールURL、ご自身が掲載されてる記事等のリンクがございましたらご記載ください。<div class="mfp_err" id="errormsg_自己PR URL（1）" style="display:none"></div><div class="mfp_err" id="errormsg_自己PR URL（2）" style="display:none"></div><div class="mfp_err" id="errormsg_自己PR URL（3）" style="display:none"></div></dd>
<dt>自由記入</dt>
<dd class="jiyu"><textarea name="自由記入" placeholder="自由にご記載ください" class=" mfp_element_textarea mfp_element_all" id="mfp_element_20" style="width: 120px; height: 12px;"></textarea><br>

・何をしているときが一番楽しいですか<br>
・あなたは5年後、10年度、どうなっていたいですか<div class="mfp_err" id="errormsg_自由記入" style="display:none"></div></dd>

<label id="mfp_element_26_label" class=" mfp_not_checked" style="cursor: pointer;"><input name="応募のきっかけ" type="checkbox" value="その他" class=" mfp_element_checkbox mfp_element_all" id="mfp_element_26">その他</label><br>
<textarea name="応募のきっかけ:その他欄内容" placeholder="その他" class=" mfp_element_textarea mfp_element_all" id="mfp_element_27" style="width: 120px; height: 12px;"></textarea><div class="mfp_err" id="errormsg_応募のきっかけ:その他欄内容" style="display:none"></div></dd>
</dl>
</div>
