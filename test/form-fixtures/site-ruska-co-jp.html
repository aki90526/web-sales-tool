<!doctype html>
<!-- source: https://ruska.co.jp/partner-apply -->
<html lang="ja"><head><meta charset="utf-8"><title>site-ruska-co-jp</title></head><body>
<form class="dlform" data-partner-form="">
    <p class="form intro" style="text-align:center;font-size:14px;line-height:2;color:var(--ink-2);margin:0 0 30px">下記フォームよりご応募ください。内容を確認のうえ、担当者より順次ご連絡いたします。<br>審査のうえ、ご希望の方はサイトの「メンバー情報」ページへの掲載も可能です。</p>

    <div class="field reveal in"><label>表示名 <span class="req">*</span><span class="lb-pub">公開</span></label><input name="name" type="text" placeholder="例) 田中 太郎 ／ ニックネームも可" required=""></div>
    <div class="field reveal in"><label>職種 <span class="req">*</span><span class="lb-pub">公開</span></label>
      <select name="role" required="">
        <option value="">選択してください</option>
        <option>Webデザイナー</option>
        <option>UI/UXデザイナー</option>
        <option>フロントエンドエンジニア</option>
        <option>バックエンドエンジニア</option>
        <option>Shopify / EC エンジニア</option>
        <option>Webディレクター / PM</option>
        <option>Webマーケター</option>
        <option>ライター / 編集</option>
        <option>その他</option>
      </select>
    </div>
    <div class="field reveal"><label>スキル・得意領域<span class="lb-pub">公開</span></label><textarea name="skills" placeholder="例) Shopify構築、Figma、React、SEO記事制作 など"></textarea></div>
    <div class="field reveal"><div class="row2">
      <div><label>稼働状況<span class="lb-priv">非公開</span></label>
        <select name="availability">
          <option value="">選択してください</option>
          <option>週1〜2日</option>
          <option>週3〜4日</option>
          <option>フルタイム可</option>
          <option>スポット / 案件単位</option>
          <option>応相談</option>
        </select>
      </div>
      <div><label>対応エリア<span class="lb-priv">非公開</span></label><input name="area" type="text" placeholder="例) フルリモート / 東京"></div>
    </div></div>
    <div class="field reveal"><label>ポートフォリオ・実績URL<span class="lb-priv">非公開</span></label><input name="portfolio_url" type="url" placeholder="例) https://your-portfolio.com"></div>
    <div class="field reveal"><label>一言PR<span class="lb-pub">公開</span></label><textarea name="bio" placeholder="得意分野や実績、意気込みなどを簡潔にご記入ください"></textarea></div>
    <div class="field reveal"><div class="row2">
      <div><label>メールアドレス <span class="req">*</span><span class="lb-priv">非公開</span></label><input name="email" type="email" placeholder="例) you@example.com" required=""></div>
      <div><label>電話番号<span class="lb-priv">非公開</span></label><input name="tel" type="tel" placeholder="例) 09012345678"></div>
    </div></div>
    <div class="field reveal"><label>連絡事項（任意）<span class="lb-priv">非公開</span></label><textarea name="message" placeholder="ご希望条件やご質問があればご記入ください"></textarea></div>

    <label class="agree reveal"><input type="checkbox" required=""> <span><a href="/privacy">プライバシーポリシー</a> に同意します</span></label>
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div class="reveal cf-turnstile" data-turnstile="" style="display:flex;justify-content:center;margin:22px 0 28px" data-sitekey="0x4AAAAAADqkbhXjFp9wxq2u"><div><div></div><input type="hidden" name="cf-turnstile-response" id="cf-chl-widget-upxh1_response" style="display:none"></div></div>
    <div class="submit reveal"><button type="submit">応募する</button></div>
    <p class="dl-note reveal">ご入力いただいた情報は、個人情報保護方針に基づき適切に管理いたします。<strong>一覧に公開されるのは「公開」表記の項目（表示名・職種・スキル・一言PR）のみ</strong>です。「非公開」表記の項目（稼働状況・対応エリア・ポートフォリオURL・メール・電話・連絡事項）はサイト上に一切公開されません。</p>
  </form>
</body></html>
