<!doctype html>

<html lang="ja"><head><meta charset="utf-8"><title>reveur-contact</title></head><body>
<form method="post" action="" enctype="multipart/form-data"><div class="form__content">
<div class="form__left">
<p>御社名※</p>
</div>
<div class="form__right text">
<input type="text" name="your-company" id="your-company" size="60" value="" placeholder="Reveur株式会社">
</div>
<div class="form__left">
<p>ご担当者様名※</p>
</div>
<div class="form__right text">
<input type="text" name="your-name" id="your-name" size="60" value="" placeholder="山田　太郎">
</div>
<div class="form__left">
<p>Email※</p>
</div>
<div class="form__right text">
<input type="email" name="your-address" id="your-address" size="60" value="" placeholder="info@abc.com" data-conv-half-alphanumeric="true">
</div>
<div class="form__left">
<p>電話番号※</p>
</div>
<div class="form__right text">
<input type="text" name="your-tel" id="your-tel" size="60" value="" placeholder="0120-000-0000">
</div>
<div class="form__left">
<p>種類※</p>
</div>
<div class="form__right checkbox">
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-content1-1">
			<input type="checkbox" name="your-content1[data][]" value="無料オンライン相談予約" id="your-content1-1">
			<span class="mwform-checkbox-field-text">無料オンライン相談予約</span>
		</label>
	</span>
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-content1-2">
			<input type="checkbox" name="your-content1[data][]" value="ホームページの新規制作・リニューアル" id="your-content1-2">
			<span class="mwform-checkbox-field-text">ホームページの新規制作・リニューアル</span>
		</label>
	</span>
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-content1-3">
			<input type="checkbox" name="your-content1[data][]" value="ECサイトの新規制作・リニューアル" id="your-content1-3">
			<span class="mwform-checkbox-field-text">ECサイトの新規制作・リニューアル</span>
		</label>
	</span>
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-content1-4">
			<input type="checkbox" name="your-content1[data][]" value="その他" id="your-content1-4">
			<span class="mwform-checkbox-field-text">その他</span>
		</label>
	</span>

<input type="hidden" name="your-content1[separator]" value="," style="display:none">

<input type="hidden" name="__children[your-content1][]" value="{&quot;\u7121\u6599\u30aa\u30f3\u30e9\u30a4\u30f3\u76f8\u8ac7\u4e88\u7d04&quot;:&quot;\u7121\u6599\u30aa\u30f3\u30e9\u30a4\u30f3\u76f8\u8ac7\u4e88\u7d04&quot;,&quot;\u30db\u30fc\u30e0\u30da\u30fc\u30b8\u306e\u65b0\u898f\u5236\u4f5c\u30fb\u30ea\u30cb\u30e5\u30fc\u30a2\u30eb&quot;:&quot;\u30db\u30fc\u30e0\u30da\u30fc\u30b8\u306e\u65b0\u898f\u5236\u4f5c\u30fb\u30ea\u30cb\u30e5\u30fc\u30a2\u30eb&quot;,&quot;EC\u30b5\u30a4\u30c8\u306e\u65b0\u898f\u5236\u4f5c\u30fb\u30ea\u30cb\u30e5\u30fc\u30a2\u30eb&quot;:&quot;EC\u30b5\u30a4\u30c8\u306e\u65b0\u898f\u5236\u4f5c\u30fb\u30ea\u30cb\u30e5\u30fc\u30a2\u30eb&quot;,&quot;\u305d\u306e\u4ed6&quot;:&quot;\u305d\u306e\u4ed6&quot;}" style="display:none">
</div>
<div class="form__left">
<p>上限予算※</p>
</div>
<div class="form__right radio">	<span class="mwform-radio-field horizontal-item">
		<label for="your-budget-1">
			<input type="radio" name="your-budget" value="50万円未満" checked="checked" id="your-budget-1">
			<span class="mwform-radio-field-text">50万円未満</span>
		</label>
	</span>
	<span class="mwform-radio-field horizontal-item">
		<label for="your-budget-2">
			<input type="radio" name="your-budget" value="50〜200万円" id="your-budget-2">
			<span class="mwform-radio-field-text">50〜200万円</span>
		</label>
	</span>
	<span class="mwform-radio-field horizontal-item">
		<label for="your-budget-3">
			<input type="radio" name="your-budget" value="300万円以上" id="your-budget-3">

		</label>
	</span>

<input type="hidden" name="__children[your-budget][]" value="{&quot;50\u4e07\u5186\u672a\u6e80&quot;:&quot;50\u4e07\u5186\u672a\u6e80&quot;,&quot;50\u301c200\u4e07\u5186&quot;:&quot;50\u301c200\u4e07\u5186&quot;,&quot;300\u4e07\u5186\u4ee5\u4e0a&quot;:&quot;300\u4e07\u5186\u4ee5\u4e0a&quot;}" style="display:none">

<div class="form__left">
<p>ご希望の連絡方法※</p>
</div>
<div class="form__right checkbox">
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-type-1">
			<input type="checkbox" name="your-type[data][]" value="電話" id="your-type-1">
			<span class="mwform-checkbox-field-text">電話</span>
		</label>
	</span>
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-type-2">
			<input type="checkbox" name="your-type[data][]" value="メール" id="your-type-2">
			<span class="mwform-checkbox-field-text">メール</span>
		</label>
	</span>
	<span class="mwform-checkbox-field horizontal-item">
		<label for="your-type-3">
			<input type="checkbox" name="your-type[data][]" value="LINE" id="your-type-3">
			<span class="mwform-checkbox-field-text">LINE</span>
		</label>
	</span>

<input type="hidden" name="your-type[separator]" value="," style="display:none">

<input type="hidden" name="__children[your-type][]" value="{&quot;\u96fb\u8a71&quot;:&quot;\u96fb\u8a71&quot;,&quot;\u30e1\u30fc\u30eb&quot;:&quot;\u30e1\u30fc\u30eb&quot;,&quot;LINE&quot;:&quot;LINE&quot;}" style="display:none">
</div>
<div class="form__left">
<p>ご相談内容</p>
</div>
<div class="form__right text">
<textarea name="your-content2" id="your-content2" cols="50" rows="5"></textarea>
</div>
</div>
<div class="submit-flex">
<div class="submit-col back" style="display:none"></div>
<div class="submit-col">
<input type="submit" name="submitConfirm" value="確認する">
</div>
