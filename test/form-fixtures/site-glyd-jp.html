<!doctype html>
<!-- source: https://glyd.jp/contact.html -->
<html lang="ja"><head><meta charset="utf-8"><title>site-glyd-jp</title></head><body>
<form class="contact-form" action="mail.php" method="post">
    <div class="form-group">
      <label for="name">お名前<span class="required">*</span></label>
      <input type="text" id="name" name="お名前" required="">
    </div>
    <div class="form-group">
      <label for="email">メールアドレス<span class="required">*</span></label>
      <input type="email" id="email" name="メールアドレス" required="">
    </div>
    <div class="form-group">
      <label for="message">お問い合わせ内容<span class="required">*</span></label>
      <textarea id="message" name="お問い合わせ内容" rows="6" required=""></textarea>
    </div>
    <div class="form-consent">
      <label class="consent-check">
        <input type="checkbox" id="privacy" name="プライバシーポリシーへの同意" value="同意する" required="">
        <span><a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する<span class="required">*</span></span>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-submit">確認</button>
    </div>
  </form>
</body></html>
